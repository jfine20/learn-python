<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Python</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0d1117;
  color: #e6edf3;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOP NAV ── */
nav {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  flex-shrink: 0;
  height: 48px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
.logo { font-weight: 700; color: #58a6ff; margin-right: 12px; font-size: 15px; white-space: nowrap; }
nav button {
  background: none; border: none; color: #8b949e;
  padding: 6px 12px; border-radius: 6px; cursor: pointer;
  font-size: 13px; white-space: nowrap; transition: all 0.15s;
}
nav button:hover { background: #21262d; color: #e6edf3; }
nav button.active { background: #1f6feb; color: #fff; }

/* ── MAIN LAYOUT ── */
main { display: flex; flex: 1; overflow: hidden; }

/* ── LEFT LESSON PANEL ── */
#lesson-panel {
  width: 42%;
  min-width: 300px;
  border-right: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

#step-header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#step-title { font-size: 14px; font-weight: 600; color: #e6edf3; }
#step-counter { font-size: 12px; color: #8b949e; }

#lesson-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
}

/* Markdown styles */
#lesson-body h2 { font-size: 18px; color: #58a6ff; margin: 0 0 16px; }
#lesson-body h3 { font-size: 15px; color: #e6edf3; margin: 20px 0 8px; }
#lesson-body p { font-size: 14px; line-height: 1.75; color: #c9d1d9; margin-bottom: 14px; }
#lesson-body ul, #lesson-body ol { padding-left: 20px; margin-bottom: 14px; }
#lesson-body li { font-size: 14px; line-height: 1.75; color: #c9d1d9; margin-bottom: 4px; }
#lesson-body code {
  background: #161b22; border: 1px solid #30363d; border-radius: 4px;
  padding: 1px 6px; font-family: "Menlo", monospace; font-size: 12px; color: #79c0ff;
}
#lesson-body pre {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin-bottom: 16px;
}
#lesson-body pre code {
  background: none; border: none; padding: 0; font-size: 13px; color: #e6edf3;
}
#lesson-body strong { color: #e6edf3; }
#lesson-body table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13px; }
#lesson-body th { background: #161b22; color: #58a6ff; padding: 8px 12px; text-align: left; border: 1px solid #30363d; }
#lesson-body td { padding: 8px 12px; border: 1px solid #30363d; color: #c9d1d9; }

/* Hint box */
#hint-box {
  margin: 16px 0;
  background: #1c2128;
  border: 1px solid #30363d;
  border-left: 3px solid #d29922;
  border-radius: 6px;
  padding: 12px 16px;
  font-size: 13px;
  color: #c9d1d9;
  line-height: 1.6;
  display: none;
}
#hint-box.visible { display: block; }

/* Step navigation */
#step-nav {
  border-top: 1px solid #30363d;
  padding: 12px 20px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  background: #161b22;
}
.step-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #30363d; cursor: pointer; transition: background 0.15s;
}
.step-dot.done { background: #3fb950; }
.step-dot.active { background: #58a6ff; }
.nav-spacer { flex: 1; }
.nav-btn {
  background: #21262d; border: 1px solid #30363d; color: #e6edf3;
  border-radius: 6px; padding: 6px 14px; font-size: 13px;
  cursor: pointer; transition: all 0.15s;
}
.nav-btn:hover { background: #30363d; }
.nav-btn:disabled { opacity: 0.4; cursor: default; }
.nav-btn.primary { background: #1f6feb; border-color: #1f6feb; }
.nav-btn.primary:hover { background: #388bfd; }

/* ── RIGHT PANEL ── */
#right-panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

#editor-toolbar {
  background: #161b22; border-bottom: 1px solid #30363d;
  padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#editor-toolbar .spacer { flex: 1; }
#hint-btn {
  background: none; border: 1px solid #d29922; color: #d29922;
  border-radius: 6px; padding: 5px 12px; font-size: 12px;
  cursor: pointer; transition: all 0.15s;
}
#hint-btn:hover { background: #d2992220; }
#run-btn {
  background: #238636; color: #fff; border: none;
  border-radius: 6px; padding: 6px 18px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
#run-btn:hover { background: #2ea043; }
#run-btn:disabled { background: #21262d; color: #484f58; cursor: default; }

#editor {
  flex: 1; min-height: 0; width: 100%;
  background: #1e1e1e; color: #d4d4d4;
  border: none; outline: none; resize: none;
  font-family: "Menlo", "Fira Code", monospace;
  font-size: 14px; line-height: 1.6; padding: 14px 16px; tab-size: 4;
}

/* ── OUTPUT ── */
#output-panel {
  border-top: 1px solid #30363d; background: #0d1117;
  flex-shrink: 0; height: 200px; display: flex; flex-direction: column;
}
#output-header {
  background: #161b22; border-bottom: 1px solid #30363d;
  padding: 6px 16px; font-size: 11px; font-weight: 600;
  color: #8b949e; letter-spacing: 0.05em; text-transform: uppercase;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#output-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #30363d; transition: background 0.2s;
}
#output-dot.ok { background: #3fb950; }
#output-dot.error { background: #f85149; }
#output-dot.running { background: #d29922; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

#check-result {
  margin-left: auto; font-size: 12px; font-weight: 600;
  padding: 2px 10px; border-radius: 10px; display: none;
}
#check-result.correct { display: block; background: #238636; color: #fff; }
#check-result.wrong { display: block; background: #da3633; color: #fff; }

#output-content {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  font-family: "Menlo", monospace; font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-all; color: #e6edf3;
}
#output-content.error { color: #f85149; }
.placeholder { color: #484f58; font-style: italic; font-family: inherit; font-size: 13px; }
</style>
</head>
<body>

<nav>
  <div class="logo">🐍 Learn Python</div>
  <div id="nav-tabs"></div>
</nav>

<main>
  <!-- LEFT: lesson content -->
  <div id="lesson-panel">
    <div id="step-header">
      <div id="step-title">Loading...</div>
      <div id="step-counter"></div>
    </div>
    <div id="lesson-body"></div>
    <div id="step-nav">
      <div id="dots"></div>
      <div class="nav-spacer"></div>
      <button class="nav-btn" id="prev-btn" onclick="changeStep(-1)">← Back</button>
      <button class="nav-btn primary" id="next-btn" onclick="changeStep(1)">Next →</button>
    </div>
  </div>

  <!-- RIGHT: editor + output -->
  <div id="right-panel">
    <div id="editor-toolbar">
      <span style="font-size:12px;color:#8b949e;">Cmd+Enter to run</span>
      <div class="spacer"></div>
      <button id="hint-btn" onclick="toggleHint()">💡 Hint</button>
      <button id="run-btn" onclick="runCode()">▶ Run</button>
    </div>
    <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
    <div id="output-panel">
      <div id="output-header">
        <div id="output-dot"></div>
        Output
        <div id="check-result"></div>
      </div>
      <div id="output-content"><span class="placeholder">Hit ▶ Run to see output here.</span></div>
    </div>
  </div>
</main>

<script>
let lessons = [];
let moduleIndex = 0;
let stepIndex = 0;
let completedSteps = {};  // "moduleIdx-stepIdx" → true
let hintVisible = false;

// ── Data helpers ──────────────────────────────────────
const currentModule = () => lessons[moduleIndex];
const currentStep   = () => currentModule()?.steps[stepIndex];
const stepKey       = (m, s) => `${m}-${s}`;

// ── Load ──────────────────────────────────────────────
async function init() {
  const res = await fetch("/api/lessons");
  lessons = await res.json();

  const nav = document.getElementById("nav-tabs");
  lessons.forEach((mod, i) => {
    const btn = document.createElement("button");
    btn.textContent = `${mod.id.split("_")[0]} ${mod.title}`;
    btn.dataset.idx = i;
    btn.onclick = () => selectModule(i);
    nav.appendChild(btn);
  });

  selectModule(0);
}

function selectModule(idx) {
  moduleIndex = idx;
  stepIndex = 0;
  hintVisible = false;
  document.querySelectorAll("nav button[data-idx]").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
  });
  renderStep();
}

// ── Render current step ──────────────────────────────
function renderStep() {
  const mod  = currentModule();
  const step = currentStep();
  if (!step) return;

  // Header
  document.getElementById("step-title").textContent = step.title;
  document.getElementById("step-counter").textContent =
    `Step ${stepIndex + 1} of ${mod.steps.length}`;

  // Lesson body — markdown + hint box
  const hintHtml = step.hint
    ? `<div id="hint-box" class="${hintVisible ? "visible" : ""}">💡 <strong>Hint:</strong> ${step.hint}</div>`
    : "";
  document.getElementById("lesson-body").innerHTML =
    marked.parse(step.teach) + hintHtml;

  // Dots
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  mod.steps.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "step-dot" +
      (completedSteps[stepKey(moduleIndex, i)] ? " done" : "") +
      (i === stepIndex ? " active" : "");
    d.onclick = () => { stepIndex = i; renderStep(); };
    dots.appendChild(d);
  });

  // Nav buttons
  document.getElementById("prev-btn").disabled = stepIndex === 0;
  document.getElementById("next-btn").textContent =
    stepIndex === mod.steps.length - 1 ? "Finish ✓" : "Next →";

  // Editor
  document.getElementById("editor").value = step.code || "";

  // Clear output
  setOutput("", false);
  document.getElementById("check-result").className = "";
  document.getElementById("check-result").textContent = "";
  hintVisible = false;
}

// ── Navigation ───────────────────────────────────────
function changeStep(dir) {
  const mod = currentModule();
  const next = stepIndex + dir;
  if (next < 0 || next >= mod.steps.length) return;
  stepIndex = next;
  renderStep();
}

// ── Hint ─────────────────────────────────────────────
function toggleHint() {
  hintVisible = !hintVisible;
  const box = document.getElementById("hint-box");
  if (box) box.classList.toggle("visible", hintVisible);
}

// ── Run code ─────────────────────────────────────────
async function runCode() {
  const code = document.getElementById("editor").value;
  if (!code.trim()) return;

  const btn = document.getElementById("run-btn");
  btn.disabled = true;
  btn.textContent = "Running...";
  document.getElementById("output-dot").className = "running";
  document.getElementById("check-result").className = "";

  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();

    if (data.stderr) {
      setOutput(data.stderr, true);
    } else {
      setOutput(data.stdout || "(no output)", false);
      checkOutput(data.stdout);
    }
  } catch {
    setOutput("Could not connect to server.", true);
  } finally {
    btn.disabled = false;
    btn.textContent = "▶ Run";
  }
}

function setOutput(text, isError) {
  const el = document.getElementById("output-content");
  el.className = isError ? "error" : "";
  el.textContent = text || "";
  if (!text) {
    el.innerHTML = '<span class="placeholder">Hit ▶ Run to see output here.</span>';
  }
  document.getElementById("output-dot").className = isError ? "error" : (text ? "ok" : "");
}

function checkOutput(actual) {
  const step = currentStep();
  if (!step?.expected) return;  // no expected — free exploration

  const normalize = s => s?.trim().replace(/\r\n/g, "\n");
  const ok = normalize(actual) === normalize(step.expected);
  const el = document.getElementById("check-result");

  if (ok) {
    el.className = "correct";
    el.textContent = "✓ Correct!";
    completedSteps[stepKey(moduleIndex, stepIndex)] = true;
    renderDots();
  } else {
    el.className = "wrong";
    el.textContent = "Not quite yet";
  }
}

function renderDots() {
  const mod = currentModule();
  document.querySelectorAll(".step-dot").forEach((d, i) => {
    d.className = "step-dot" +
      (completedSteps[stepKey(moduleIndex, i)] ? " done" : "") +
      (i === stepIndex ? " active" : "");
  });
}

// ── Tab key ──────────────────────────────────────────
document.getElementById("editor").addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const el = e.target;
    const s = el.selectionStart;
    el.value = el.value.slice(0, s) + "    " + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = s + 4;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    runCode();
  }
});

init();
</script>
</body>
</html>
