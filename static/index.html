<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Python</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── NAV ── */
  nav {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    flex-shrink: 0;
    height: 48px;
  }
  nav .logo {
    font-weight: 700;
    color: #58a6ff;
    margin-right: 16px;
    font-size: 15px;
    white-space: nowrap;
  }
  nav button {
    background: none;
    border: none;
    color: #8b949e;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  nav button:hover { background: #21262d; color: #e6edf3; }
  nav button.active { background: #1f6feb; color: #fff; }

  /* ── MAIN ── */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── LESSON PANEL ── */
  #lesson-panel {
    width: 40%;
    min-width: 280px;
    border-right: 1px solid #30363d;
    overflow-y: auto;
    padding: 28px 32px;
    flex-shrink: 0;
  }
  #lesson-panel h1 { font-size: 20px; margin-bottom: 20px; color: #58a6ff; }
  #lesson-content h1 { font-size: 18px; color: #e6edf3; margin: 24px 0 10px; }
  #lesson-content h2 { font-size: 15px; color: #58a6ff; margin: 20px 0 8px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
  #lesson-content p  { font-size: 14px; line-height: 1.7; color: #c9d1d9; margin-bottom: 12px; }
  #lesson-content ul, #lesson-content ol { padding-left: 20px; margin-bottom: 12px; }
  #lesson-content li { font-size: 14px; line-height: 1.7; color: #c9d1d9; margin-bottom: 4px; }
  #lesson-content code {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 12px;
    color: #79c0ff;
  }
  #lesson-content pre {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin-bottom: 14px;
  }
  #lesson-content pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    color: #e6edf3;
  }
  #lesson-content strong { color: #e6edf3; }

  /* ── RIGHT PANEL ── */
  #right-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  #editor-toolbar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #editor-toolbar span {
    font-size: 12px;
    color: #8b949e;
    flex: 1;
  }

  #run-btn {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #run-btn:hover { background: #2ea043; }
  #run-btn:active { background: #1a7f2e; }
  #run-btn:disabled { background: #21262d; color: #484f58; cursor: default; }

  #clear-btn {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #clear-btn:hover { background: #21262d; color: #e6edf3; }

  #editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #1e1e1e;
    color: #d4d4d4;
    border: none;
    outline: none;
    resize: none;
    font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 14px 16px;
    tab-size: 4;
  }

  /* ── OUTPUT ── */
  #output-panel {
    border-top: 1px solid #30363d;
    background: #0d1117;
    flex-shrink: 0;
    height: 200px;
    display: flex;
    flex-direction: column;
  }
  #output-header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 6px 16px;
    font-size: 11px;
    font-weight: 600;
    color: #8b949e;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #output-status {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #30363d;
    transition: background 0.2s;
  }
  #output-status.ok    { background: #3fb950; }
  #output-status.error { background: #f85149; }
  #output-status.running { background: #d29922; }

  #output-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #output-content.has-error { color: #f85149; }

  #empty-state {
    color: #484f58;
    font-style: italic;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
  }

  /* ── LOADING ── */
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    background: #0d1117;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #8b949e;
  }
  #loading.visible { display: flex; }
</style>
</head>
<body>

<div id="loading" class="visible">Loading...</div>

<nav>
  <div class="logo">🐍 Learn Python</div>
  <div id="nav-tabs"></div>
</nav>

<main>
  <div id="lesson-panel">
    <div id="lesson-content"></div>
  </div>

  <div id="right-panel">
    <div id="editor-toolbar">
      <span>Cmd+Enter to run</span>
      <button id="clear-btn">Clear</button>
      <button id="run-btn">▶ Run</button>
    </div>
    <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
    <div id="output-panel">
      <div id="output-header">
        <div id="output-status"></div>
        Output
      </div>
      <div id="output-content">
        <span id="empty-state">Run your code to see output here.</span>
      </div>
    </div>
  </div>
</main>

<script>
let lessons = [];
let currentLesson = null;
const editor = {
  getValue: () => document.getElementById("editor").value,
  setValue: (v) => { document.getElementById("editor").value = v; }
};

const STARTERS = {

`,

  "04_lists_and_loops": `# Step 1 — list basics

print("original:", original)   # what do you expect?

# -- YOUR TURN --
# Get only even numbers from 1-20 using a list comprehension

print(evens)
`,

  "05_dicts_and_sets": `# Step 1 — create and read a dict

averages = {}
# your code here
print(averages)

    pass  # your code here

# print(parse_age("-5"))    # ValueError: Age can't be negative
`,

  "08_modules": `# Step 1 — json

data = {"name": "Jack", "scores": [95, 87, 92], "active": True}
text = json.dumps(data, indent=2)

};

async function loadLessons() {
  const res = await fetch("/api/lessons");
  lessons = await res.json();

  const nav = document.getElementById("nav-tabs");
  lessons.forEach((lesson, i) => {
    const btn = document.createElement("button");
    btn.textContent = `${lesson.num} ${lesson.title}`;
    btn.onclick = () => selectLesson(i);
    btn.dataset.index = i;
    nav.appendChild(btn);
  });

  if (lessons.length > 0) selectLesson(0);
  document.getElementById("loading").classList.remove("visible");
}

function selectLesson(index) {
  currentLesson = lessons[index];

  // Update nav
  document.querySelectorAll("nav button[data-index]").forEach((b, i) => {
    b.classList.toggle("active", i === index);
  });

  // Render lesson markdown
  document.getElementById("lesson-content").innerHTML =
    marked.parse(currentLesson.content);

  // Load starter code
  const starter = STARTERS[currentLesson.id] || "# Write your Python here\nprint('hello!')\n";
  editor.setValue(starter);

  // Clear output
  clearOutput();
}

async function runCode() {
  const code = editor.getValue();
  if (!code.trim()) return;

  const btn = document.getElementById("run-btn");
  const status = document.getElementById("output-status");
  const output = document.getElementById("output-content");

  btn.disabled = true;
  btn.textContent = "Running...";
  status.className = "running";
  output.className = "";
  output.textContent = "";

  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();

    if (data.stderr) {
      output.className = "has-error";
      output.textContent = data.stderr;
      status.className = "error";
    } else {
      output.textContent = data.stdout || "(no output)";
      status.className = "ok";
    }
  } catch (e) {
    output.className = "has-error";
    output.textContent = "Failed to connect to server.";
    status.className = "error";
  } finally {
    btn.disabled = false;
    btn.textContent = "▶ Run";
  }
}

function clearOutput() {
  const output = document.getElementById("output-content");
  output.className = "";
  output.innerHTML = '<span id="empty-state">Run your code to see output here.</span>';
  document.getElementById("output-status").className = "";
}

document.getElementById("run-btn").onclick = runCode;
document.getElementById("clear-btn").onclick = () => {
  editor.setValue("");
  clearOutput();
};

// Tab key inserts spaces instead of moving focus
document.getElementById("editor").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const el = e.target;
    const start = el.selectionStart;
    el.value = el.value.slice(0, start) + "    " + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = start + 4;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    runCode();
  }
});

loadLessons();
</script>
</body>
</html>
